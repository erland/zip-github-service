quarkus.application.name=zip-buildserver-api
quarkus.http.root-path=/
quarkus.http.test-port=0

# Database defaults.
# The test profile intentionally does not define a JDBC URL so Quarkus Dev Services can
# provide an isolated PostgreSQL container during @QuarkusTest startup.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:zip_buildserver}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:zip_buildserver}
quarkus.flyway.migrate-at-start=true
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/zip_buildserver}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/zip_buildserver}

quarkus.smallrye-openapi.path=/q/openapi


# Static API token authentication. Keep health and OpenAPI public; protect API endpoints by default.
zip-buildserver.auth.enabled=${ZIP_BUILDSERVER_AUTH_ENABLED:true}
zip-buildserver.auth.api-token=${ZIP_BUILDSERVER_API_TOKEN:change-me}

# Existing tests exercise API behavior without auth unless an auth-specific test profile enables it.
%test.zip-buildserver.auth.enabled=false
%test.zip-buildserver.auth.api-token=test-token

# Test profile uses Quarkus Dev Services/Testcontainers for database-backed tests.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=none

# Package intake limits and storage
zip-buildserver.storage.packages-dir=${ZIP_BUILDSERVER_PACKAGES_DIR:target/zip-buildserver/packages}
zip-buildserver.storage.workspaces-dir=${ZIP_BUILDSERVER_WORKSPACES_DIR:target/zip-buildserver/workspaces}
zip-buildserver.storage.artifacts-dir=${ZIP_BUILDSERVER_ARTIFACTS_DIR:target/zip-buildserver/artifacts}
zip-buildserver.artifacts.retention-days=${ZIP_BUILDSERVER_ARTIFACT_RETENTION_DAYS:14}
zip-buildserver.packages.max-compressed-size-bytes=${ZIP_BUILDSERVER_MAX_ARCHIVE_SIZE_BYTES:104857600}
zip-buildserver.packages.max-extracted-size-bytes=${ZIP_BUILDSERVER_MAX_EXTRACTED_SIZE_BYTES:524288000}
zip-buildserver.packages.max-files=${ZIP_BUILDSERVER_MAX_FILES:20000}
zip-buildserver.packages.max-path-length=${ZIP_BUILDSERVER_MAX_PATH_LENGTH:1024}


# Worker execution
# Keep fake execution as the default for deterministic local tests. Set to docker to run approved
# commands in the configured worker container image.
zip-buildserver.worker.executor=${ZIP_BUILDSERVER_WORKER_EXECUTOR:fake}
zip-buildserver.worker.docker.image=${ZIP_BUILDSERVER_WORKER_IMAGE:zip-buildserver-worker-node-maven:local}
zip-buildserver.worker.docker.memory=${ZIP_BUILDSERVER_WORKER_MEMORY:2g}
zip-buildserver.worker.docker.cpus=${ZIP_BUILDSERVER_WORKER_CPUS:2}
zip-buildserver.worker.docker.network=${ZIP_BUILDSERVER_WORKER_NETWORK:bridge}
zip-buildserver.worker.docker.host-workspaces-dir=${ZIP_BUILDSERVER_WORKER_HOST_WORKSPACES_DIR:target/zip-buildserver/workspaces}
zip-buildserver.worker.max-output-bytes=${ZIP_BUILDSERVER_WORKER_MAX_OUTPUT_BYTES:1048576}

# Retention cleanup
zip-buildserver.retention.cleanup-enabled=${ZIP_BUILDSERVER_RETENTION_CLEANUP_ENABLED:true}
zip-buildserver.retention.cleanup-interval=${ZIP_BUILDSERVER_RETENTION_CLEANUP_INTERVAL:24h}
zip-buildserver.packages.retention-days=${ZIP_BUILDSERVER_PACKAGE_RETENTION_DAYS:7}
zip-buildserver.sessions.retention-days=${ZIP_BUILDSERVER_SESSION_RETENTION_DAYS:90}
zip-buildserver.workspaces.cleanup-grace-minutes=${ZIP_BUILDSERVER_WORKSPACE_CLEANUP_GRACE_MINUTES:60}

%test.zip-buildserver.retention.cleanup-enabled=false
