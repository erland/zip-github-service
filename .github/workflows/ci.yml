name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active project structure
        run: ./scripts/verify-structure.sh
      - name: Verify tracked source files
        run: ./scripts/verify-source-tracking.sh
      - name: Run security regression baseline
        run: ./scripts/security-regression.sh
      - name: Validate shell scripts
        run: |
          find scripts backend -type f \( -name '*.sh' -o -name 'mvnw' \) -print0 \
            | xargs -0 -r -n1 bash -n
      - name: Verify implementation ledger
        run: ./scripts/verify-implementation-status.sh
      - name: Verify MVP release artifacts
        run: ./scripts/verify-release.sh
      - name: Verify ignored generated files
        run: |
          test -f .gitignore
          ! git ls-files | grep -E '(^|/)(node_modules|target|dist|coverage)/'

  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Maven wrapper
        working-directory: backend
        run: ./mvnw --batch-mode --version
      - name: Test and package backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  container-images:
    name: Build and publish container images
    needs: [structure, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read image version and tags
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          short_sha=${GITHUB_SHA:0:12}
          backend="ghcr.io/${owner}/zip-github-service-backend"
          frontend="ghcr.io/${owner}/zip-github-service-frontend"
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]] && \
             { [[ "${GITHUB_REF}" == "refs/heads/main" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; }; then
            publish=true
          fi
          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "backend_tags<<EOF"
            echo "${backend}:sha-${short_sha}"
            echo "${backend}:${version}"
            if [[ "${version}" == *-rc.* ]]; then
              echo "${backend}:rc"
            else
              IFS=. read -r major minor patch <<< "${version}"
              echo "${backend}:${major}.${minor}"
              echo "${backend}:${major}"
              echo "${backend}:latest"
            fi
            echo "EOF"
            echo "frontend_tags<<EOF"
            echo "${frontend}:sha-${short_sha}"
            echo "${frontend}:${version}"
            if [[ "${version}" == *-rc.* ]]; then
              echo "${frontend}:rc"
            else
              IFS=. read -r major minor patch <<< "${version}"
              echo "${frontend}:${major}.${minor}"
              echo "${frontend}:${major}"
              echo "${frontend}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: steps.image-meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ steps.image-meta.outputs.publish == 'true' }}
          tags: ${{ steps.image-meta.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ steps.image-meta.outputs.publish == 'true' }}
          tags: ${{ steps.image-meta.outputs.frontend_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
