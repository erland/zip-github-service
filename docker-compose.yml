services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zip_github}
      POSTGRES_USER: ${POSTGRES_USER:-zip_github}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zip_github}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zip_github}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-zip_github}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-zip_github}
    ports: ["${BACKEND_PORT:-8080}:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-5173}:80"]
volumes:
  postgres-data:
