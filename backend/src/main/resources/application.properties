quarkus.application.name=zip-github-api
quarkus.http.test-port=0
quarkus.smallrye-openapi.path=/q/openapi
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:zip_github}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:zip_github}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/zip_github}
quarkus.flyway.migrate-at-start=true
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.enabled=false

# GitHub App user authorization and browser session configuration
zipgithub.github.client-id=${GITHUB_APP_CLIENT_ID:development-client-id}
zipgithub.github.client-secret=${GITHUB_APP_CLIENT_SECRET:development-client-secret}
zipgithub.github.callback-url=${GITHUB_APP_CALLBACK_URL:http://localhost:8080/api/auth/github/callback}
zipgithub.frontend-url=${ZIP_GITHUB_FRONTEND_URL:http://localhost:5173}
zipgithub.cookies.secure=${ZIP_GITHUB_SECURE_COOKIES:true}
%dev.zipgithub.cookies.secure=false
%test.zipgithub.cookies.secure=false

# GitHub App installation authentication for repository operations
zipgithub.github.app-id=${GITHUB_APP_ID:0}
# PKCS#8 PEM; environment values may contain literal \\n sequences.
zipgithub.github.app-private-key=${GITHUB_APP_PRIVATE_KEY:}

# Temporary source package storage. Actual archive inspection is implemented in later phase-3 steps.
zipgithub.upload.storage-root=${ZIP_GITHUB_UPLOAD_STORAGE_ROOT:${java.io.tmpdir}/zip-github/uploads}
zipgithub.upload.max-compressed-bytes=${ZIP_GITHUB_UPLOAD_MAX_COMPRESSED_BYTES:104857600}
zipgithub.upload.retention-hours=${ZIP_GITHUB_UPLOAD_RETENTION_HOURS:24}

# ZIP inspection and decompression limits (defence against oversized archives and ZIP bombs)
zipgithub.archive.max-uncompressed-bytes=${ZIP_GITHUB_ARCHIVE_MAX_UNCOMPRESSED_BYTES:524288000}
zipgithub.archive.max-entries=${ZIP_GITHUB_ARCHIVE_MAX_ENTRIES:20000}
zipgithub.archive.max-single-file-bytes=${ZIP_GITHUB_ARCHIVE_MAX_SINGLE_FILE_BYTES:52428800}
zipgithub.archive.max-path-length=${ZIP_GITHUB_ARCHIVE_MAX_PATH_LENGTH:1024}
zipgithub.archive.max-compression-ratio=${ZIP_GITHUB_ARCHIVE_MAX_COMPRESSION_RATIO:100.0}
zipgithub.archive.max-compressed-bytes=${ZIP_GITHUB_UPLOAD_MAX_COMPRESSED_BYTES:104857600}
zipgithub.upload.cleanup-interval=${ZIP_GITHUB_UPLOAD_CLEANUP_INTERVAL:1h}

# Temporary shallow Git workspaces used to lock and inventory one exact repository commit.
zipgithub.snapshot.workspace-root=${ZIP_GITHUB_SNAPSHOT_WORKSPACE_ROOT:${java.io.tmpdir}/zip-github-snapshots}

# Isolated Git workspaces retained only until commit/push or failure cleanup.
zipgithub.delivery.workspace-root=${ZIP_GITHUB_DELIVERY_WORKSPACE_ROOT:${java.io.tmpdir}/zip-github-delivery}


# Browser/API security hardening
zipgithub.security.csrf.enabled=${ZIP_GITHUB_CSRF_ENABLED:true}
%test.zipgithub.security.csrf.enabled=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ZIP_GITHUB_FRONTEND_URL:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Content-Type,X-Filename,X-Zip-GitHub-Request
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.limits.max-header-size=32K

zipgithub.security.rate-limit.enabled=${ZIP_GITHUB_RATE_LIMIT_ENABLED:true}
%test.zipgithub.security.rate-limit.enabled=false

# Durable project configuration persistence. Unit/API tests keep the existing isolated in-memory store.
zipgithub.persistence.projects.enabled=${ZIP_GITHUB_PROJECT_PERSISTENCE_ENABLED:true}
%test.zipgithub.persistence.projects.enabled=false
