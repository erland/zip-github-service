server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the container proxy upload limit explicit. The backend still enforces
    # the authoritative byte limit from ZIP_GITHUB_UPLOAD_MAX_COMPRESSED_BYTES.
    client_max_body_size ${ZIP_GITHUB_NGINX_CLIENT_MAX_BODY_SIZE};

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /q/ {
        proxy_pass http://backend:8080/q/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
