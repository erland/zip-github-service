name: Release application and ChatGPT plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to rebuild, for example v1.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    env:
      ZIP_GITHUB_MCP_URL: ${{ vars.ZIP_GITHUB_MCP_URL || 'https://zip-github.apphome.one/mcp' }}
      ZIP_GITHUB_CHATGPT_APP_ID: ${{ vars.ZIP_GITHUB_CHATGPT_APP_ID }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version, optionally prefixed with v. Got: ${tag}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build verified backend runtime
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build verified frontend runtime
        working-directory: frontend
        run: |
          npm ci
          npm test
          VITE_ZIP_GITHUB_VERSION="${{ steps.version.outputs.version }}" npm run build

      - name: Build ChatGPT web plugin package
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [[ -z "${ZIP_GITHUB_CHATGPT_APP_ID}" ]]; then
            echo "Repository variable ZIP_GITHUB_CHATGPT_APP_ID must contain the registered ChatGPT app id before release." >&2
            exit 1
          fi
          node scripts/build-plugin.mjs --version "${version}" --target chatgpt
          node scripts/build-plugin.mjs --version "${version}" --target desktop
          mkdir -p build
          (cd build/plugin-chatgpt && zip -qr "../zip-github-plugin-${version}.zip" zip-github)
          (cd build/plugin-desktop && zip -qr "../zip-github-plugin-desktop-${version}.zip" zip-github)
          echo "archive=build/zip-github-plugin-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "desktop_archive=build/zip-github-plugin-desktop-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Inspect plugin archives
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "${{ steps.plugin.outputs.archive }}"
          unzip -p "${{ steps.plugin.outputs.archive }}" zip-github/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);if(p.version!=='${{ steps.version.outputs.version }}'||p.extensions['com.openai'].apps!=='./.app.json')process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" zip-github/.app.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>JSON.parse(s))"
          if unzip -l "${{ steps.plugin.outputs.archive }}" | grep -q 'zip-github/mcp.json'; then
            echo "ChatGPT web package must not contain mcp.json" >&2
            exit 1
          fi
          unzip -p "${{ steps.plugin.outputs.desktop_archive }}" zip-github/mcp.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>JSON.parse(s))"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve container tags
        id: images
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          short_sha=${GITHUB_SHA:0:12}
          backend="ghcr.io/${owner}/zip-github-service-backend"
          frontend="ghcr.io/${owner}/zip-github-service-frontend"

          {
            echo "backend_tags<<EOF"
            echo "${backend}:${version}"
            echo "${backend}:sha-${short_sha}"
            if [[ "${version}" == *-rc.* ]]; then
              echo "${backend}:rc"
            else
              IFS=. read -r major minor patch <<< "${version}"
              echo "${backend}:${major}.${minor}"
              echo "${backend}:${major}"
              echo "${backend}:latest"
            fi
            echo "EOF"

            echo "frontend_tags<<EOF"
            echo "${frontend}:${version}"
            echo "${frontend}:sha-${short_sha}"
            if [[ "${version}" == *-rc.* ]]; then
              echo "${frontend}:rc"
            else
              IFS=. read -r major minor patch <<< "${version}"
              echo "${frontend}:${major}.${minor}"
              echo "${frontend}:${major}"
              echo "${frontend}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.runtime
          push: true
          tags: ${{ steps.images.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=zip-GitHub Backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.runtime
          push: true
          tags: ${{ steps.images.outputs.frontend_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=zip-GitHub Frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Attach plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.plugin.outputs.archive }}" "${{ steps.plugin.outputs.desktop_archive }}" --clobber

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "- Backend image: `ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zip-github-service-backend:${{ steps.version.outputs.version }}`"
            echo "- Frontend image: `ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zip-github-service-frontend:${{ steps.version.outputs.version }}`"
            echo "- ChatGPT web plugin: `zip-github-plugin-${{ steps.version.outputs.version }}.zip`"
            echo "- Desktop MCP plugin: `zip-github-plugin-desktop-${{ steps.version.outputs.version }}.zip`"
          } >> "$GITHUB_STEP_SUMMARY"
