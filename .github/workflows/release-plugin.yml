name: Release application and ChatGPT plugin

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    env:
      ZIP_GITHUB_MCP_URL: ${{ vars.ZIP_GITHUB_MCP_URL || 'https://zip-github.apphome.one/mcp' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version, optionally prefixed with v. Got: ${tag}" >&2
            exit 1
          fi

          repository_version=$(tr -d '[:space:]' < VERSION)
          if [[ "${repository_version}" != "${version}" ]]; then
            echo "Release tag version ${version} does not match VERSION ${repository_version} on the tagged commit." >&2
            echo "Update VERSION before publishing the release so source metadata and release metadata cannot drift." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build verified backend runtime
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build verified frontend runtime
        working-directory: frontend
        run: |
          npm ci
          npm test
          VITE_ZIP_GITHUB_VERSION="${{ steps.version.outputs.version }}" npm run build

      - name: Build ChatGPT plugin package
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          node scripts/build-plugin.mjs --version "${version}"
          mkdir -p build
          (cd build/plugin && zip -qr "../zip-github-plugin-${version}.zip" zip-github)
          echo "archive=build/zip-github-plugin-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Inspect plugin archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "${{ steps.plugin.outputs.archive }}"
          unzip -p "${{ steps.plugin.outputs.archive }}" zip-github/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);if(p.version!=='${{ steps.version.outputs.version }}')process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" zip-github/mcp.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>JSON.parse(s))"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve container tags
        id: images
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          short_sha=${GITHUB_SHA:0:12}
          backend="ghcr.io/${owner}/zip-github-service-backend"
          frontend="ghcr.io/${owner}/zip-github-service-frontend"

          {
            echo "backend_tags<<EOF"
            echo "${backend}:${version}"
            echo "${backend}:sha-${short_sha}"
            if [[ "${version}" == *-rc.* ]]; then
              echo "${backend}:rc"
            else
              IFS=. read -r major minor patch <<< "${version}"
              echo "${backend}:${major}.${minor}"
              echo "${backend}:${major}"
              echo "${backend}:latest"
            fi
            echo "EOF"

            echo "frontend_tags<<EOF"
            echo "${frontend}:${version}"
            echo "${frontend}:sha-${short_sha}"
            if [[ "${version}" == *-rc.* ]]; then
              echo "${frontend}:rc"
            else
              IFS=. read -r major minor patch <<< "${version}"
              echo "${frontend}:${major}.${minor}"
              echo "${frontend}:${major}"
              echo "${frontend}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.runtime
          push: true
          tags: ${{ steps.images.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=zip-GitHub Backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.runtime
          push: true
          tags: ${{ steps.images.outputs.frontend_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=zip-GitHub Frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Attach plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.plugin.outputs.archive }}" --clobber

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "- Backend image: `ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zip-github-service-backend:${{ steps.version.outputs.version }}`"
            echo "- Frontend image: `ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zip-github-service-frontend:${{ steps.version.outputs.version }}`"
            echo "- Plugin: `zip-github-plugin-${{ steps.version.outputs.version }}.zip`"
          } >> "$GITHUB_STEP_SUMMARY"
